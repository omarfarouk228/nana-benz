<body>
  <canvas id="scene" aria-label="Le Grand marché de Lomé"></canvas>

  <!-- barre du marché -->
  <header id="bar" hidden>
    <div class="b-date"><b id="b-day">Jour 1</b><span id="b-date">lundi 2 décembre 1974</span></div>
    <div class="b-clock"><span id="b-hour">7 h 00</span><i class="b-sun"><i id="b-sun"></i></i></div>
    <div class="b-money"><b id="b-money">0 F</b><span id="b-rep">Réputation</span></div>
    <button class="icon" id="b-mute" aria-label="Son"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button>
  </header>
  <footer id="shelf" hidden>
    <div class="sh-items" id="sh-items"></div>
    <div class="sh-acts"><button class="btn small gold" id="b-hail" title="Crier un boniment pour attirer un passant">Héler les passants</button>
    <button class="btn small ghost" id="b-close">Fermer le stand</button></div>
  </footer>
  <div id="toasts" aria-live="polite"></div>

  <main id="screen" class="screen"></main>
  <div id="modal" class="modal" hidden></div>

  <div id="loading"><div class="ld-mark">Nana<br>Benz</div></div>
  <script type="module" src="/src/main.js"></script>
